[package]
name = "reel-scanner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
reel-core.workspace = true
async-trait = "0.1"
notify = "8"
notify-debouncer-full = "0.5"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "process", "time", "fs"] }
tracing = "0.1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
