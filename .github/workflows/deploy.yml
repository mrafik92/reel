name: deploy

# One-click deploy of the latest image to CT 113 (ticket #68).
# Trigger: Actions → deploy → "Run workflow" (web or GitHub mobile). That click is the approval gate.
# Runs on the self-hosted runner (CT 116, label `homelab`): outbound-only, and its SSH key on minix is
# pinned to the forced command /usr/local/bin/reel-deploy (verbs: `sha`, `deploy`).
# The repo must stay PRIVATE while a self-hosted runner is attached.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why (optional, shown in the run summary)"
        required: false
        type: string
      since:
        description: "Only update tickets for <sha>..latest, no deploy (recovery)"
        required: false
        type: string

concurrency:
  group: deploy-ct113
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, homelab]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy latest image to CT 113, health-check, move tickets to Deployed
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          DEPLOY_SSH: root@10.10.10.10
          REASON: ${{ inputs.reason }}
          SINCE: ${{ inputs.since }}
        run: |
          [ -n "$REASON" ] && echo "**Reason:** $REASON" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$SINCE" ]; then
            python3 deploy/ct113/deploy.py --forced --since "$SINCE"
          else
            python3 deploy/ct113/deploy.py --forced
          fi
