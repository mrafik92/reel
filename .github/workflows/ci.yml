name: ci

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86
        with:
          components: rustfmt, clippy
      - name: ffmpeg (tests generate media with it)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: OpenAPI spec is up to date
        run: |
          cargo run -q -p reel-api --bin export-openapi > /tmp/openapi.json
          diff -u openapi.json /tmp/openapi.json

  clients:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter @reel/sdk generate
      - run: bun run typecheck
      - run: bun run build
