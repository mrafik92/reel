name: ci

# Once per PR (not push + pull_request), and once per push to main — main's run also writes the shared
# Rust cache that PRs restore.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read   # dorny/paths-filter lists the PR's files

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ github.event_name != 'pull_request' || steps.filter.outputs.server == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'

  server:
    needs: changes
    # Web/docs-only PRs skip this job (a skipped job counts as passing for branch protection).
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86
        with:
          components: rustfmt, clippy
      - name: No debug info in CI (smaller caches, faster link)
        # Config (not env) because Cargo.toml sets `[profile.dev.package."*"] debug`, which env can't override.
        run: |
          CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"; mkdir -p "$CARGO_HOME"
          cat >> "$CARGO_HOME/config.toml" <<'EOF'
          [profile.dev]
          debug = 0
          [profile.dev.package."*"]
          debug = 0
          EOF
      - uses: rui314/setup-mold@v1
      - uses: taiki-e/install-action@nextest
      - name: ffmpeg (tests generate media with it)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: reel
          # PRs restore main's warm cache but don't upload multi-GB copies of their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - name: sqlx builds SQLite only (no MySQL/Postgres driver, no rsa)
        # sqlx-mysql and rsa stay in Cargo.lock (cargo lists disabled optional deps), so cargo-audit
        # still names RUSTSEC-2023-0071; this proves they are not compiled. See server/.cargo/audit.toml.
        run: |
          for c in sqlx-mysql sqlx-postgres rsa; do
            out=$(cargo tree --locked --workspace --target all -e normal,build -i "$c" 2>/dev/null)
            if [ -n "$out" ]; then echo "::error::$c is in the build graph"; echo "$out"; exit 1; fi
          done
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # nextest runs tests from all binaries in parallel; the crates have no doctests (the one in
      # playback/src/lib.rs is `ignore`d), so there is no `cargo test --doc` step.
      - run: cargo nextest run --workspace --locked
      - name: OpenAPI spec is up to date
        run: |
          cargo run --locked -q -p reel-api --bin export-openapi > "$RUNNER_TEMP/openapi.json"
          diff -u openapi.json "$RUNNER_TEMP/openapi.json"

  clients:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter @reel/sdk generate
      - run: bun run typecheck
      - run: bun run build

  docs:
    # AGENTS.md §6: every PR that changes code updates docs/ — or says why not.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Code changes come with docs (or an explicit opt-out)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "$changed"
          code=$(echo "$changed" | grep -E '^(server/crates|clients/(apps|packages)|deploy)/' | grep -vE '(_test|/tests/)' || true)
          docs=$(echo "$changed" | grep -E '^(docs/|AGENTS\.md|deploy/README\.md)' || true)
          if [ -n "$code" ] && [ -z "$docs" ]; then
            if printf '%s' "$BODY" | grep -qiE 'docs:[[:space:]]*no (doc )?change'; then
              echo "No docs changed — opt-out given in the PR description."
            else
              echo "::error::This PR changes code but not docs/. Update docs/ (see AGENTS.md §6) or add 'Docs: no change because …' to the PR description."
              exit 1
            fi
          fi
