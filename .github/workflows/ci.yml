name: ci

# Once per PR (not push + pull_request), and once per push to main — main's run also writes the shared
# Rust cache that PRs restore.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read   # dorny/paths-filter lists the PR's files

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ github.event_name != 'pull_request' || steps.filter.outputs.server == 'true' }}
      android: ${{ github.event_name != 'pull_request' || steps.filter.outputs.android == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'
            android:
              - 'clients/android/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/android-release.yml'

  server:
    needs: changes
    # Web/docs-only PRs skip this job (a skipped job counts as passing for branch protection).
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86
        with:
          components: rustfmt, clippy
      - name: No debug info in CI (smaller caches, faster link)
        # Config (not env) because Cargo.toml sets `[profile.dev.package."*"] debug`, which env can't override.
        run: |
          CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"; mkdir -p "$CARGO_HOME"
          cat >> "$CARGO_HOME/config.toml" <<'EOF'
          [profile.dev]
          debug = 0
          [profile.dev.package."*"]
          debug = 0
          EOF
      - uses: rui314/setup-mold@v1
      - uses: taiki-e/install-action@nextest
      # ffmpeg's .debs are cached per runner image (ImageVersion changes ~weekly), so most runs skip
      # `apt-get update` and the download and just dpkg-install them. Any failure falls back to apt.
      - name: ffmpeg cache key
        id: apt-key
        run: echo "key=apt-ffmpeg-${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: apt
        with:
          path: ~/apt-ffmpeg
          key: ${{ steps.apt-key.outputs.key }}
      - name: ffmpeg (tests generate media with it)
        run: |
          # needrestart's apt hook alone takes ~5 s; unsafe-io skips dpkg's per-file fsync.
          as_root() { sudo NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive "$@"; }
          if compgen -G "$HOME/apt-ffmpeg/*.deb" >/dev/null \
             && as_root dpkg -i --force-unsafe-io "$HOME"/apt-ffmpeg/*.deb >/dev/null; then
            echo "installed from cached .debs"
          else
            as_root apt-get update -qq
            as_root apt-get install -y -qq -f --no-install-recommends \
              -o Dpkg::Options::=--force-unsafe-io -o APT::Keep-Downloaded-Packages=true ffmpeg
            rm -rf ~/apt-ffmpeg && mkdir -p ~/apt-ffmpeg && cp /var/cache/apt/archives/*.deb ~/apt-ffmpeg/
          fi
          ffmpeg -version | head -1
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.apt.outputs.cache-hit != 'true'
        with:
          path: ~/apt-ffmpeg
          key: ${{ steps.apt-key.outputs.key }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: reel
          # PRs restore main's warm cache but don't upload multi-GB copies of their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Test media that playback tests synthesize with ffmpeg (most of their CPU time). Fixtures are
      # content-keyed (command line + ffmpeg version, see crates/playback/tests/common), so a stale
      # restore only means a regenerate. Saved from main only, like the Rust cache.
      - name: Test media cache key
        id: fixtures-key
        run: echo "key=reel-fixtures-$(ffmpeg -version | head -1 | sha256sum | cut -c1-12)-${{ hashFiles('server/crates/playback/tests/**') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: fixtures
        with:
          path: server/target/tmp/reel-fixtures
          key: ${{ steps.fixtures-key.outputs.key }}
          restore-keys: reel-fixtures-
      - run: cargo fmt --check
      - name: sqlx builds SQLite only (no MySQL/Postgres driver, no rsa)
        # sqlx-mysql and rsa stay in Cargo.lock (cargo lists disabled optional deps), so cargo-audit
        # still names RUSTSEC-2023-0071; this proves they are not compiled. See server/.cargo/audit.toml.
        run: |
          for c in sqlx-mysql sqlx-postgres rsa; do
            out=$(cargo tree --locked --workspace --target all -e normal,build -i "$c" 2>/dev/null)
            if [ -n "$out" ]; then echo "::error::$c is in the build graph"; echo "$out"; exit 1; fi
          done
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # nextest runs tests from all binaries in parallel; the crates have no doctests (the one in
      # playback/src/lib.rs is `ignore`d), so there is no `cargo test --doc` step. The `ci` profile
      # (server/.config/nextest.toml) sets the parallelism for the 2-vCPU runner.
      - run: |
          touch "$RUNNER_TEMP/tests-start"
          cargo nextest run --workspace --locked --profile ci
      # The test build already linked this binary (reel-api's integration tests need its bins), with
      # the test build's feature set. `cargo run` would rebuild the workspace crates for it (~30 s).
      - name: OpenAPI spec is up to date
        run: |
          target/debug/export-openapi > "$RUNNER_TEMP/openapi.json"
          diff -u openapi.json "$RUNNER_TEMP/openapi.json"
      - name: Drop test media no test used
        if: github.ref == 'refs/heads/main' && steps.fixtures.outputs.cache-hit != 'true'
        run: find target/tmp/reel-fixtures -type f ! -newer "$RUNNER_TEMP/tests-start" -delete
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.fixtures.outputs.cache-hit != 'true'
        with:
          path: server/target/tmp/reel-fixtures
          key: ${{ steps.fixtures-key.outputs.key }}
      - name: Keep test media out of the Rust cache
        if: always()
        run: rm -rf target/tmp

  clients:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter @reel/sdk generate
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  android:
    needs: changes
    # Native Android app (#29). PRs that don't touch clients/android/ skip it.
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image ships the Android SDK (ANDROID_HOME); AGP installs any missing platform.
      # Caches ~/.gradle (wrapper + dependencies); written from main only, like the Rust cache.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # assembleRelease (unsigned here) runs R8, so shrinking problems fail the PR, not the release tag (#195).
      - run: ./gradlew --no-daemon lint testDebugUnitTest assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: clients/android/app/build/reports/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: reel-android-debug
          path: clients/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  docs:
    # AGENTS.md §6: every PR that changes code updates docs/ — or says why not.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Code changes come with docs (or an explicit opt-out)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "$changed"
          code=$(echo "$changed" | grep -E '^(server/crates|clients/(apps|packages|android)|deploy)/' | grep -vE '(_test|/tests/)' || true)
          docs=$(echo "$changed" | grep -E '^(docs/|AGENTS\.md|deploy/README\.md)' || true)
          if [ -n "$code" ] && [ -z "$docs" ]; then
            if printf '%s' "$BODY" | grep -qiE 'docs:[[:space:]]*no (doc )?change'; then
              echo "No docs changed — opt-out given in the PR description."
            else
              echo "::error::This PR changes code but not docs/. Update docs/ (see AGENTS.md §6) or add 'Docs: no change because …' to the PR description."
              exit 1
            fi
          fi
