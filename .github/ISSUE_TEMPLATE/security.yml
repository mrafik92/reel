name: Security finding
description: A vulnerability or hardening item (keep exploit details minimal if the repo becomes public)
labels: [security]
body:
  - type: dropdown
    id: severity
    attributes: { label: Severity, options: [Critical, High, Medium, Low] }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes: { label: Evidence, description: "file:line references" }
    validations: { required: true }
  - type: textarea
    id: impact
    attributes: { label: Impact / exploit sketch }
  - type: textarea
    id: fix
    attributes: { label: Proposed fix + test }
