<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Reel app icon: the single source for every favicon, PWA and TV icon.
       Regenerate the sizes with `bun run icons` (clients/) after editing (#142).
       Palette (#177): crimson tile (accent token), cream reel (ink token); the cut-outs show the tile.
       Keep the tile colour equal to TILE in scripts/gen-icons.ts: full-bleed and maskable
       variants paint TILE behind a scaled copy of this file. -->
